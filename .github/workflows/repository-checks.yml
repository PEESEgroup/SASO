name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependency
        run: python -m pip install "numpy>=1.26,<3"

      - name: Validate released artifacts
        run: python scripts/validate_repository.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
